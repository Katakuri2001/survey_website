name = "alcohol-survey-platform"
main = "apps/api/src/index.ts"
compatibility_date = "2026-09-01"

# Production is an explicit Wrangler environment. Do not use a bare
# `wrangler deploy` or `wrangler secret put`: those commands target the
# top-level environment and are intentionally not the release target.
#   npx wrangler deploy --config wrangler.toml --env production
#   npx wrangler secret put JWT_SECRET --config wrangler.toml --env production

# Optional cron: cancels spins left in-flight by a crash so users can retry.
# Harmless to leave enabled; remove if you prefer to manage it elsewhere.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Production (the only Worker deployment target)
# ---------------------------------------------------------------------------
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
# Comma-separated extra browser origins allowed to call the API.
# Same-origin (the normal Pages deployment) is always allowed.
ALLOWED_ORIGINS = ""
PUBLIC_SITE_ORIGIN = ""
DB_DEBUG = "false"

[[env.production.d1_databases]]
binding = "survey_db"
database_name = "survey-db"
database_id = "449a4386-9e0f-4e65-b7cf-e37cc0de491c"

# ---------------------------------------------------------------------------
# Optional production add-ons. Uncomment only when the resource exists; the
# Worker degrades gracefully when the binding is absent.
# ---------------------------------------------------------------------------
[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "survey-assets"

# ---------------------------------------------------------------------------
# Development (local by default; never use this target for a release)
# ---------------------------------------------------------------------------
[env.development]
[env.development.vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001"
PUBLIC_SITE_ORIGIN = "http://localhost:3000"
DB_DEBUG = "true"

[[env.development.d1_databases]]
binding = "survey_db"
database_name = "survey-db"
database_id = "449a4386-9e0f-4e65-b7cf-e37cc0de491c"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "survey-assets"
