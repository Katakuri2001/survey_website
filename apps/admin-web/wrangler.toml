name = "alcohol-survey-admin"
pages_build_output_dir = "out"
compatibility_date = "2026-05-03"

# Non-secret runtime config for the Pages Function that serves /api/*.
# Set the same JWT_SECRET as the survey project as a Pages secret:
#   npx wrangler pages secret put JWT_SECRET --project-name alcohol-survey-admin
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = ""
PUBLIC_SITE_ORIGIN = ""
# Public Turnstile site key. The admin Pages project bundles the same API, so
# setting the site key here (plus TURNSTILE_SECRET as a secret) keeps guest
# signup and spin protected on this origin too instead of becoming a bypass.
TURNSTILE_SITE_KEY = "0x4AAAAAAE-v_qmikTPp1LVj"

[[d1_databases]]
  binding = "survey_db"
  database_name = "survey-db"
  database_id = "449a4386-9e0f-4e65-b7cf-e37cc0de491c"

[[r2_buckets]]
  binding = "MEDIA_BUCKET"
  bucket_name = "survey-assets"